<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- browser chrome color follows the system scheme (the in-app theme prefers localStorage; this is the OS-level approximation) -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa" />
    <title>PermaDrive — Permanent Storage on Autonomys</title>
    <meta
      name="description"
      content="PermaDrive: a permissionless permanent storage client for Autonomys. Files go straight on-chain and are archived permanently by the farmer network."
    />
    <script>
      // Set the theme before first paint to avoid a flash; keep in sync with src/lib/theme.ts
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
